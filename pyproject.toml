[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clock_confidence_intervals"
version = "0.1.0"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"

dependencies = [
    "allantools",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clock_confidence_intervals"]
